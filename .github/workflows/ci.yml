name: CI

on:
  push:
    branches: [main]
  pull_request:

# bash on every runner: Windows defaults to PowerShell. Commands go through `uv run --no-sync`
# rather than activating the venv, whose layout differs (.venv/bin vs .venv\Scripts).
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        exclude:
          # No Windows-on-ARM CPython builds before 3.11 in actions/setup-python.
          - os: windows-11-arm
            python-version: "3.10"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv venv --python "$(python -c 'import sys; print(sys.executable)')"
          uv pip install -e ".[dev]"

      - name: Smoke test
        run: |
          uv run --no-sync python -c "import warc2zip"
          uv run --no-sync warc2zip --help

      - name: Tests
        run: uv run --no-sync pytest -q

  # The README's real archives (Hugging Face, data.commoncrawl.org, the EOT bucket, archive.org),
  # `--limit 20` each. Its own job so a remote outage fails here, by name, and not the unit matrix.
  # One Python version, every OS.
  integration:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv venv --python "$(python -c 'import sys; print(sys.executable)')"
          uv pip install -e ".[dev]"

      - name: Integration tests
        run: uv run --no-sync pytest -q -m integration --durations=10

      # Ruff linting/formatting — uncomment when ready to enforce in CI
      # - name: Lint
      #   run: |
      #     uv pip install ruff
      #     uv run --no-sync ruff check warc2zip.py
      #     uv run --no-sync ruff format --check warc2zip.py

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warc2zip"
version = "0.1.0"
description = "Convert WARC files into zip-of-files plus metadata"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "fsspec[http]",
    "tqdm>=4.67.3",
    "warcio[s3]>=1.8.1",  # this drags in s3 (boto3) for fsspec, too
]

[project.optional-dependencies]
dev = ["ruff==0.17.1", "pytest>=8.0"]

[project.urls]
Repository = "https://github.com/commoncrawl/warc2zip"
Issues = "https://github.com/commoncrawl/warc2zip/issues"

[project.scripts]
warc2zip = "warc2zip:cli"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.pytest.ini_options]
# The default `pytest` run is offline and self-contained (synthetic WARC/ARC fixtures, a local
# stand-in for archive.org). The tests that download the README's real archives are opt-in:
# `pytest -m integration` converts the first 20 captures of each (a separate CI job), and
# `pytest -m long` streams the whole files (0.4–10 GB each; the manual "Long tests" workflow).
addopts = "-m 'not long and not integration'"
markers = [
    "integration: downloads real archives listed in the README, --limit 20 each (WARC2ZIP_OFFLINE=1 skips)",
    "long: full-file conversions of the README archives; hours, never in the per-push CI",
]

[tool.bumpversion]
current_version = "0.1.0"
commit = true
tag = true
tag_name = "v{new_version}"
message = "Bump version: {current_version} → {new_version}"

# pyproject.toml's [project] version is bumped by bump-my-version itself; keep uv.lock in step.
[[tool.bumpversion.files]]
filename = "uv.lock"
search = """
name = "warc2zip"
version = "{current_version}"
"""
replace = """
name = "warc2zip"
version = "{new_version}"
"""
